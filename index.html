<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NutriMedDX – Clinical Nutrition &amp; Dietetics Game</title>
<style>
:root{--bg:#f3f6f8;--card:#fff;--ink:#1c2733;--mut:#677482;--pri:#0b6e75;--pri2:#dff0f1;--ok:#166534;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#92400e;--warnbg:#fef3c7;--line:#dbe2e8;--gold:#d97706}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--ink:#e6edf2;--mut:#93a1ae;--pri:#4fc3c9;--pri2:#16363a;--ok:#86efac;--okbg:#12301d;--bad:#fca5a5;--badbg:#3b1a1a;--warn:#fcd34d;--warnbg:#3a2e10;--line:#2a3743;--gold:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--pri);color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
@media (prefers-color-scheme:dark){header{background:#0c4a4f}}
header h1{margin:0;font-size:18px;cursor:pointer}
.xp{font-size:13px;min-width:200px}
.bar{height:8px;background:rgba(255,255,255,.3);border-radius:6px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:#fcd34d}
main{max-width:780px;margin:0 auto;padding:16px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{margin:0 0 8px;font-size:19px}
.muted{color:var(--mut)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mode{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;color:inherit;font:inherit}
.mode:hover,.mode:focus-visible{border-color:var(--pri);outline:2px solid var(--pri2)}
.mode b{display:block;font-size:17px;margin-bottom:2px}
.mode span{font-size:13.5px;color:var(--mut)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;cursor:pointer}
@media (prefers-color-scheme:dark){.btn{color:#062a2d}}
.btn.sec{background:var(--pri2);color:var(--pri)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--pri)}
.q{font-size:18px;margin:6px 0 12px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:inherit;border:2px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:8px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{padding:10px 12px;border-radius:8px;margin:10px 0;font-size:15px}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.no{background:var(--badbg);color:var(--bad)}
.fb p{margin:4px 0 0;color:var(--ink)}
.case{border-left:4px solid var(--pri);background:var(--pri2);border-radius:8px;padding:12px 14px;margin-bottom:12px;font-size:15px}
.case h3{margin:0 0 6px;font-size:16px}
.case p{margin:4px 0}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:6px}
td,th{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-size:12px}
.H{color:var(--bad);font-weight:700}.L{color:var(--warn);font-weight:700}
.tag{display:inline-block;background:var(--pri2);color:var(--pri);border-radius:10px;padding:1px 9px;font-size:12px}
.badge{display:inline-block;border:1px solid var(--gold);color:var(--gold);border-radius:10px;padding:2px 10px;margin:3px 4px 3px 0;font-size:13px}
.lives{letter-spacing:2px}
input[type=search]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card);color:inherit}
dt{font-weight:700;margin-top:10px}dd{margin:0;color:var(--mut)}
.big{font-size:40px;font-weight:700;color:var(--pri)}
.rev{border-top:1px solid var(--line);padding:10px 0;font-size:15px}
footer{max-width:780px;margin:0 auto;padding:0 16px 30px;font-size:12.5px;color:var(--mut)}
</style>
</head>
<body>
<header>
  <h1 id="home">🩺 NutriMedDX</h1>
  <div class="xp" id="xp"></div>
</header>
<main id="app"></main>
<footer>Educational game for students. Cases are fictional. Doses and targets reflect common adult or WHO reference values and may differ between guidelines; always verify against your local formulary and protocols. Not for clinical decision-making.</footer>

["Pernicious anaemia without neurological involvement. Initial hydroxocobalamin regimen?","1 mg IM on alternate days for 2 weeks, then 1 mg every 3 months",["1 mg IM daily for life","50 µg orally once weekly","A single 1 mg injection, then nothing"],"Loading replaces stores. Lifelong maintenance is needed because intrinsic factor is absent."],
["An adult with vitamin D deficiency. Typical treatment?","A loading course (for example 50,000 IU weekly for 6–8 weeks), then maintenance of 800–2,000 IU daily",["50,000 IU daily for life","100 IU once a month","No treatment unless a fracture occurs"],"Loading corrects the deficit. Maintenance prevents relapse."],
["WHO advice for zinc in a child over 6 months with acute diarrhoea:","20 mg per day for 10–14 days",["100 mg per day for 3 days","5 mg as a single dose","20 mg weekly for 4 weeks"],"Zinc reduces the duration and severity of diarrhoea and lowers later episodes."],
["A child aged 12 months or more with measles. WHO vitamin A advice?","200,000 IU orally once daily for 2 consecutive days",["2,000 IU once","1 million IU daily for a week","None, since vitamin A is harmful in infection"],"Vitamin A reduces measles complications and mortality. Infants 6–11 months get 100,000 IU."],
["Prevention of vitamin K deficiency bleeding in a term newborn:","1 mg IM at birth",["10 mg IM monthly","100 mg orally weekly","None needed if breastfed"],"Newborns have low vitamin K stores. Breast milk is a poor source."],
["Lactulose in hepatic encephalopathy is titrated to produce:","2–3 soft stools per day (commonly 30–45 mL two to three times daily)",["No stools, since constipation is the goal","6–8 watery stools per day","One hard stool every 3 days"],"Lactulose acidifies the gut lumen and traps ammonia. Watery diarrhoea causes dehydration and worsens encephalopathy."],
["In exocrine pancreatic insufficiency, when should pancreatic enzyme capsules (for example Creon) be taken?","With the first mouthfuls of meals and snacks that contain fat, with dose matched to the fat content",["Once at bedtime on an empty stomach","Only with fluids between meals","30 minutes after finishing a meal"],"Enzymes must mix with food to digest fat. Doses are adjusted to fat intake and symptoms."],
["Calcium acetate or sevelamer (phosphate binders) in CKD should be taken:","With meals, to bind dietary phosphate",["On an empty stomach at bedtime only","Two hours after meals","Only on non-dialysis days"],"Binders must be in the gut at the same time as food phosphate."],
["Counselling for levothyroxine in a patient also taking iron and calcium:","Take on an empty stomach 30–60 minutes before breakfast and separate from iron and calcium by about 4 hours",["Take with the iron tablet to improve absorption","Take with a large breakfast and coffee","Take with the calcium supplement at lunch"],"Iron, calcium, coffee and food reduce levothyroxine absorption."],
["A patient on warfarin eats green leafy vegetables. Dietitian's advice?","Keep vitamin K intake consistent and avoid sudden large changes",["Avoid all green vegetables","Eat as many greens as possible before INR tests","Vitamin K intake is irrelevant"],"Vitamin K counteracts warfarin, so steady intake keeps the INR stable."],
["Counselling for a patient with type 2 diabetes starting metformin:","Take with meals to reduce stomach upset, and monitor B12 with long-term use",["Take only while fasting","Avoid all carbohydrate while on it","Double the dose if you skip a meal"],"Metformin commonly causes GI upset and long-term use can lower vitamin B12."],
["Why does WHO low-osmolarity ORS contain glucose?","Sodium–glucose co-transport in the gut drives absorption of sodium and water",["To supply most of the daily energy needs","To treat hypoglycaemia","To neutralise stomach acid"],"The SGLT1 transporter moves sodium and glucose together, with water following."],
["Dosing for hypoglycaemia in a conscious patient:","15–20 g of fast-acting carbohydrate, with glucose rechecked in 15 minutes",["50 g of fat as a chocolate bar","Insulin 10 units","No treatment if the patient is awake"],"Fast-acting sugar is quickest. Fat delays absorption."],
["Oral nutritional supplements (sip feeds) are best used for:","Patients at risk of malnutrition who can eat but not meet needs from food alone",["Patients with a completely non-functioning gut","Replacing all meals in healthy adults","Patients who are nil by mouth"],"If the gut works, use it. A non-functioning gut needs parenteral nutrition."]
];

/* ================= STATE ================= */
const KEY = "nutrition_quest_v1";
const LEVELS = [[0,"Student Dietitian"],[100,"Ward Intern"],[300,"Junior Dietitian"],[600,"Clinical Dietitian"],[1000,"Senior Dietitian"],[1600,"Consultant"]];
const BADGES = {
  first:["🥇","First Round"],perfect:["💯","Perfect Round"],streak5:["🔥","5-Streak"],streak10:["⚡","10-Streak"],
  cases:["🕵️","Case Cracker"],pharm:["💊","Pharmacist"],ward:["🛡️","Ward Survivor"],xp500:["⭐","Rising Star"]
};
const def = () => ({xp:0,bestStreak:0,rounds:0,answered:0,correct:0,badges:[],mode:{}});
let S = load();
function load(){ try{ const d=JSON.parse(localStorage.getItem(KEY)); if(d) return Object.assign(def(),d); }catch(e){} return def(); }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pct = (a,b) => b ? Math.round(a/b*100) : 0;

function level(){ let i=0; LEVELS.forEach((l,k)=>{ if(S.xp>=l[0]) i=k; }); const next=LEVELS[i+1]; return {name:LEVELS[i][1],i,next,from:LEVELS[i][0]}; }
function drawXP(){
  const L=level(), w = L.next ? pct(S.xp-L.from, L.next[0]-L.from) : 100;
  $("#xp").innerHTML = `${esc(L.name)} · ${S.xp} XP${L.next?` <span style="opacity:.8">(next: ${L.next[0]})</span>`:""}<div class="bar"><i style="width:${w}%"></i></div>`;
}

/* ================= ROUND BUILDING ================= */
function fromTuple(t,tag){ return {q:t[0],right:t[1],wrongs:t[2],why:t[3],tag}; }
function jargonItems(n){
  return shuffle(JARGON).slice(0,n).map(([t,d])=>{
    const others = shuffle(JARGON.filter(x=>x[0]!==t));
    if(Math.random()<.5) return {q:`What does <b>${esc(t)}</b> mean?`,right:d,wrongs:others.slice(0,3).map(x=>x[1]),why:`${t}: ${d}.`,tag:"Jargon"};
    return {q:`Which term means: “${esc(d)}”?`,right:t,wrongs:others.slice(0,3).map(x=>x[0]),why:`${t}: ${d}.`,tag:"Jargon"};
  });
}
function caseCard(c,showDx){
  const labs = c.labs.map(l=>`<tr><td>${esc(l[0])}</td><td class="${l[3]}">${esc(l[1])}${l[3]?" "+(l[3]==="H"?"▲":"▼"):""}</td><td class="muted">${esc(l[2])}</td></tr>`).join("");
  return `<div class="case"><h3>${esc(c.title)}</h3><p><b>${esc(c.pt)}</b></p><p><b>History:</b> ${esc(c.hx)}</p><p><b>Symptoms and signs:</b> ${esc(c.sx)}</p>
  <table><tr><th>Lab</th><th>Result</th><th>Reference</th></tr>${labs}</table>${showDx?`<p style="margin-top:8px"><b>Working diagnosis:</b> ${esc(c.dx.right)}</p>`:""}</div>`;
}
function caseItems(n){
  return shuffle(CASES).slice(0,n).flatMap(c=>[
    {ctx:caseCard(c,false),q:"What is the most likely diagnosis?",right:c.dx.right,wrongs:c.dx.wrongs,why:c.dx.why,pts:15,tag:"Diagnosis"},
    {ctx:caseCard(c,true),q:c.plan.q,right:c.plan.right,wrongs:c.plan.wrongs,why:c.plan.why,pts:15,tag:"Management"}]);
}
const condItems = n => shuffle(COND).slice(0,n).map(t=>fromTuple(t,"Conditions"));
const medItems  = n => shuffle(MEDS).slice(0,n).map(t=>fromTuple(t,"Meds"));

const MODES = {
  jargon:{name:"Jargon Blitz",icon:"📖",desc:"Match medical terms with their meanings.",build:()=>jargonItems(10)},
  cond:{name:"Ward Conditions",icon:"🏥",desc:"Nutrition management of conditions seen on the wards.",build:()=>condItems(8)},
  cases:{name:"Case Files",icon:"🕵️",desc:"History, symptoms and labs. Diagnose, then manage. 3 cases.",build:()=>caseItems(3)},
  meds:{name:"Meds & Supplements",icon:"💊",desc:"Indications, doses and counselling for drugs and supplements.",build:()=>medItems(8)},
  ward:{name:"Ward Round Challenge",icon:"🛡️",desc:"Mixed questions and a full case with 3 lives. How far can you go?",lives:3,
    build:()=>shuffle([...jargonItems(4),...condItems(3),...medItems(3)]).concat(caseItems(1))}
};

/* ================= GAME FLOW ================= */
let R = null;
function start(mode){
  const M = MODES[mode];
  const items = M.build().map(it=>Object.assign({pts:10},it,{opts:shuffle([it.right,...it.wrongs])}));
  R = {mode,items,i:0,score:0,streak:0,maxStreak:0,xpGain:0,lives:M.lives||0,wrong:[],answered:false};
  drawQ();
}
function drawQ(){
  const it=R.items[R.i], M=MODES[R.mode];
  const lives = M.lives ? `<span class="lives">${"❤️".repeat(R.lives)}${"🖤".repeat(M.lives-R.lives)}</span>` : "";
  $("#app").innerHTML = `<div class="card">
    <div class="top"><span><span class="tag">${esc(it.tag||M.name)}</span> Question ${R.i+1} of ${R.items.length}</span><span>${lives} 🔥 ${R.streak} · ${R.score} correct</span></div>
    <div class="prog"><i style="width:${R.i/R.items.length*100}%"></i></div>
    ${it.ctx||""}<div class="q">${it.q}</div>
    <div id="opts">${it.opts.map((o,k)=>`<button class="opt" data-k="${k}">${k+1}. ${esc(o)}</button>`).join("")}</div>
    <div id="fb"></div><div id="nx"></div></div>`;
  R.answered=false;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
}
function answer(k){
  if(!R||R.answered) return; R.answered=true;
  const it=R.items[R.i], ok = it.opts[k]===it.right;
  document.querySelectorAll(".opt").forEach((b,j)=>{ b.disabled=true; if(it.opts[j]===it.right) b.classList.add("right"); else if(j===k) b.classList.add("wrong"); });
  S.answered++; const m=S.mode[R.mode]=S.mode[R.mode]||{a:0,c:0}; m.a++;
  let msg;
  if(ok){
    R.score++; R.streak++; R.maxStreak=Math.max(R.maxStreak,R.streak); S.correct++; m.c++;
    const pts = it.pts + Math.min(R.streak,5)*2; R.xpGain+=pts; S.xp+=pts; S.bestStreak=Math.max(S.bestStreak,R.streak);
    msg = `<div class="fb ok"><b>Correct! +${pts} XP</b><p>${esc(it.why)}</p></div>`;
  } else {
    R.streak=0; if(R.lives) R.lives--; R.wrong.push(it);
    msg = `<div class="fb no"><b>Not quite.</b> The answer is: ${esc(it.right)}<p>${esc(it.why)}</p></div>`;
  }
  save(); drawXP();
  const last = R.i===R.items.length-1 || (MODES[R.mode].lives && R.lives===0);
  $("#fb").innerHTML=msg;
  $("#nx").innerHTML=`<button class="btn" id="next">${last?"See results":"Next ▶"}</button>`;
  $("#next").onclick=()=>last?finish():(R.i++,drawQ()); $("#next").focus();
}
function finish(){
  const n = R.i + 1 > R.items.length ? R.items.length : R.i + 1, M=MODES[R.mode];
  const total = M.lives && R.lives===0 ? n : R.items.length;
  S.rounds++;
  const got=[], add=id=>{ if(!S.badges.includes(id)){ S.badges.push(id); got.push(id);} };
  add("first");
  if(R.score===total && total>=6) add("perfect");
  if(S.bestStreak>=5) add("streak5"); if(S.bestStreak>=10) add("streak10");
  if(R.mode==="cases" && R.score>=5) add("cases");
  if(R.mode==="meds" && R.score>=7) add("pharm");
  if(R.mode==="ward" && R.lives>0) add("ward");
  if(S.xp>=500) add("xp500");
  save(); drawXP();
  const p=pct(R.score,total), word = p===100?"Flawless!":p>=80?"Excellent work!":p>=60?"Good effort. Review the misses below.":"Keep practising. Every mistake is a lesson.";
  $("#app").innerHTML = `<div class="card" style="text-align:center"><div class="big">${R.score}/${total}</div><h2>${word}</h2>
    <p class="muted">+${R.xpGain} XP · best streak this round: ${R.maxStreak}${M.lives&&R.lives===0?" · out of lives":""}</p>
    ${got.length?`<p>New badge${got.length>1?"s":""}: ${got.map(b=>`<span class="badge">${BADGES[b][0]} ${BADGES[b][1]}</span>`).join("")}</p>`:""}
    <div class="row" style="justify-content:center"><button class="btn" id="again">Play again</button><button class="btn sec" id="back">Home</button></div></div>
    ${R.wrong.length?`<div class="card"><h2>Review your misses</h2>${R.wrong.map(w=>`<div class="rev">${w.ctx?"<i class='muted'>(case question)</i> ":""}<b>${w.q}</b><br>✔ ${esc(w.right)}<br><span class="muted">${esc(w.why)}</span></div>`).join("")}</div>`:""}`;
  $("#again").onclick=()=>start(R.mode); $("#back").onclick=home; R=null;
}

/* ================= SCREENS ================= */
function home(){
  R=null;
  $("#app").innerHTML = `<div class="card"><h2>Welcome to the ward, doctor-in-training.</h2>
    <p class="muted">Learn medical jargon, nutrition management of ward conditions, diagnosis from cases, and medications and supplements. Earn XP, build streaks and collect badges. Progress is saved in this browser.</p></div>
    <div class="modes">${Object.entries(MODES).map(([k,m])=>{const s=S.mode[k];return `<button class="mode" data-m="${k}"><b>${m.icon} ${m.name}</b><span>${m.desc}</span><br><span>${s?`Accuracy: ${pct(s.c,s.a)}% (${s.a} answered)`:"Not played yet"}</span></button>`}).join("")}
      <button class="mode" id="gl"><b>🔎 Glossary</b><span>Search all ${JARGON.length} jargon terms to study before you play.</span></button></div>
    <div class="card" style="margin-top:14px"><h2>Your stats</h2>
      <p>Rounds: <b>${S.rounds}</b> · Questions: <b>${S.answered}</b> · Accuracy: <b>${pct(S.correct,S.answered)}%</b> · Best streak: <b>${S.bestStreak}</b></p>
      <p>${S.badges.length?S.badges.map(b=>`<span class="badge">${BADGES[b][0]} ${BADGES[b][1]}</span>`).join(""):`<span class="muted">No badges yet. Finish a round to earn your first.</span>`}</p>
      <button class="btn sec" id="reset">Reset progress</button></div>`;
  document.querySelectorAll(".mode[data-m]").forEach(b=>b.onclick=()=>start(b.dataset.m));
  $("#gl").onclick=glossary;
  $("#reset").onclick=()=>{ if(confirm("Erase all XP, stats and badges in this browser?")){ S=def(); save(); drawXP(); home(); } };
}
function glossary(){
  const sorted=JARGON.slice().sort((a,b)=>a[0].localeCompare(b[0]));
  $("#app").innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h2>Glossary</h2><button class="btn sec" id="b">← Home</button></div>
    <input type="search" id="s" placeholder="Search terms or meanings" aria-label="Search glossary"><dl id="l"></dl></div>`;
  const draw=q=>{ q=q.toLowerCase(); $("#l").innerHTML=sorted.filter(x=>!q||x[0].toLowerCase().includes(q)||x[1].toLowerCase().includes(q)).map(x=>`<dt>${esc(x[0])}</dt><dd>${esc(x[1])}</dd>`).join("")||`<p class="muted">No matches.</p>`; };
  draw(""); $("#s").oninput=e=>draw(e.target.value); $("#b").onclick=home;
}

document.addEventListener("keydown",e=>{
  if(!R||e.target.tagName==="INPUT") return;
  if(!R.answered && /^[1-4]$/.test(e.key)){ const b=document.querySelectorAll(".opt")[+e.key-1]; if(b) answer(+e.key-1); }
  else if(R.answered && (e.key==="Enter"||e.key===" ")){ const n=$("#next"); if(n){ e.preventDefault(); n.click(); } }
});
$("#home").onclick=()=>{ if(!R||confirm("Leave this round? Progress in the round will be lost.")) home(); };
drawXP(); home();
</script>
</body>
</html>
